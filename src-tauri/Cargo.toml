[package]
name = "biochemcalc"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
license = "AGPL-3.0-or-later"
default-run = "biochemcalc"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "biochemcalc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "reparse_test1"
path = "src/bin/reparse_test1.rs"

[[bin]]
name = "import_bulk_json"
path = "src/bin/import_bulk_json.rs"

[[bin]]
name = "export_biomolecules"
path = "src/bin/export_biomolecules.rs"

[[bin]]
name = "biochemcalc-server"
path = "src/bin/server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled", "uuid"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.18"
rand = "0.10.2"
tokio = { version = "1", features = ["full"] }
evalexpr = "13.1.0"
regex = "1"
log = "0.4"
simplelog = { version = "0.12", default-features = false }
axum = "0.8.9"
tower-http = { version = "0.7.0", features = ["fs", "cors"] }
argon2 = { version = "0.5.3", features = ["std"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }

